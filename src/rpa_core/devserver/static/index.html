<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rpa_core 编辑器</title>
<style>
:root { --border: #d0d7de; --muted: #656d76; --accent: #0969da; --ok: #1a7f37; --bad: #cf222e; --bg: #f6f8fa; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1f2328; height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg); flex-wrap: wrap; }
header .brand { font-weight: 600; margin-right: 8px; }
button, select, input, textarea { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
button { cursor: pointer; }
button:hover { background: var(--bg); }
main { flex: 1; display: flex; min-height: 0; }
#palette { width: 240px; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
#palette input { margin: 8px; }
#palette-list { list-style: none; margin: 0; padding: 0 8px 8px; overflow-y: auto; flex: 1; }
#palette-list li { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
#palette-list li:hover { border-color: var(--accent); }
.kind { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 0 6px; white-space: nowrap; }
#canvas-wrap { flex: 1; overflow-y: auto; padding: 12px; min-width: 0; }
h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
#canvas { list-style: none; margin: 0; padding: 0; max-width: 640px; }
#canvas li { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; background: #fff; }
#canvas li.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
#canvas li.dragging { opacity: 0.4; }
#canvas li.drop-above { box-shadow: 0 -3px 0 0 var(--accent); }
#canvas li.drop-below { box-shadow: 0 3px 0 0 var(--accent); }
#canvas li.hint { cursor: default; color: var(--muted); border-style: dashed; }
#canvas .idx { color: var(--muted); width: 22px; flex-shrink: 0; }
#canvas .cmd { font-weight: 600; white-space: nowrap; }
#canvas .args { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: Consolas, monospace; font-size: 12px; }
#canvas .ops { display: flex; gap: 4px; }
#canvas .ops button { padding: 0 6px; }
#props { width: 320px; border-left: 1px solid var(--border); padding: 12px; overflow-y: auto; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.field .req { color: var(--bad); }
.field input[type=text], .field input[type=number], .field select, .field textarea { width: 100%; }
.field textarea { font-family: Consolas, monospace; min-height: 64px; }
.hint { font-size: 12px; color: var(--muted); }
footer { border-top: 1px solid var(--border); padding: 8px 12px; max-height: 180px; overflow-y: auto; background: var(--bg); }
#valid-badge { font-weight: 600; }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.error-line { font-family: Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="brand">rpa_core 编辑器</span>
  <input id="file-name" placeholder="文件名（如 demo）" style="width: 160px">
  <span id="dirty-badge" class="hidden" style="color: var(--bad); font-size: 12px;">● 未保存</span>
  <button id="btn-new">新建</button>
  <select id="open-select"><option value="">打开…</option></select>
  <button id="btn-save">保存</button>
  <button id="btn-compile">编译</button>
  <span id="valid-badge" class="hidden"></span>
</header>
<main>
  <aside id="palette">
    <input id="palette-filter" placeholder="过滤命令…">
    <ul id="palette-list"></ul>
  </aside>
  <section id="canvas-wrap">
    <h2>画布 · sequence root</h2>
    <ol id="canvas"></ol>
    <p class="hint">点击左侧命令追加节点，或拖拽到画布任意位置插入；拖拽画布节点调整顺序。引用语法 ${inputs.x}、${steps.节点.outputs.键}、${loop.item}</p>
  </section>
  <aside id="props">
    <h2>属性</h2>
    <div id="props-body"></div>
  </aside>
</main>
<footer id="compile-panel"><span class="hint">点击「编译」校验当前工作流（保存草稿不要求编译通过）</span></footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { catalog: [], workflow: null, selected: -1, dirty: false };
let dragState = null;
let pendingDrop = null;
const NAME_PATTERN = /^[A-Za-z][A-Za-z0-9_-]*$/;
const REFERENCE_HINT = "支持引用：${inputs.x} / ${steps.节点.outputs.键} / ${loop.item} / ${error.code}";

async function api(method, path, body) {
  const options = { method, headers: {} };
  if (body !== undefined) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const res = await fetch(path, options);
  let data;
  try { data = await res.json(); } catch { data = {}; }
  if (!res.ok) throw new Error(data.message || data.error || `HTTP ${res.status}`);
  return data;
}

const manifestOf = (command) => state.catalog.find((c) => c.id === command);

function markDirty() {
  state.dirty = true;
  $("dirty-badge").classList.remove("hidden");
  $("valid-badge").classList.add("hidden");
}

function clearDirty() {
  state.dirty = false;
  $("dirty-badge").classList.add("hidden");
}

function newWorkflow() {
  state.workflow = {
    schema_version: "1.0",
    id: "draft",
    name: "未命名工作流",
    inputs: {},
    root: { type: "sequence", id: "root", children: [] },
  };
  state.selected = -1;
  $("file-name").value = "";
  clearDirty();
  render();
}

async function refreshOpenList(selectedValue) {
  const data = await api("GET", "/api/workflows");
  const select = $("open-select");
  select.textContent = "";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "打开…";
  select.appendChild(placeholder);
  for (const name of data.workflows) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    select.appendChild(option);
  }
  select.value = selectedValue || "";
}

function renderPalette() {
  const filter = $("palette-filter").value.trim().toLowerCase();
  const list = $("palette-list");
  list.textContent = "";
  for (const manifest of state.catalog) {
    if (filter && !manifest.id.toLowerCase().includes(filter)) continue;
    const li = document.createElement("li");
    li.dataset.command = manifest.id;
    const idSpan = document.createElement("span");
    idSpan.textContent = manifest.id;
    const kindSpan = document.createElement("span");
    kindSpan.className = "kind";
    kindSpan.textContent = manifest.kind;
    li.appendChild(idSpan);
    li.appendChild(kindSpan);
    li.draggable = true;
    li.addEventListener("dragstart", (e) => {
      dragState = { type: "new", command: manifest.id };
      e.dataTransfer.effectAllowed = "copy";
    });
    li.addEventListener("dragend", handleDragEnd);
    li.addEventListener("click", () => appendAction(manifest.id));
    list.appendChild(li);
  }
}

function appendAction(command) {
  insertAction(command, state.workflow.root.children.length);
}

function insertAction(command, index) {
  const children = state.workflow.root.children;
  const base = command.split(".").pop();
  let id = base;
  let n = 2;
  while (children.some((c) => c.id === id)) { id = `${base}${n}`; n += 1; }
  children.splice(index, 0, { type: "action", id, command, with: {} });
  state.selected = index;
  markDirty();
  render();
}

function moveNodeTo(from, to) {
  const children = state.workflow.root.children;
  if (to < 0) to = 0;
  if (to > children.length) to = children.length;
  const insertAt = to > from ? to - 1 : to;
  if (insertAt === from) return;
  const [node] = children.splice(from, 1);
  children.splice(insertAt, 0, node);
  state.selected = insertAt;
}

function moveNode(index, delta) {
  const children = state.workflow.root.children;
  const target = index + delta;
  if (target < 0 || target >= children.length) return;
  const [node] = children.splice(index, 1);
  children.splice(target, 0, node);
  state.selected = target;
  markDirty();
  render();
}

function removeNode(index) {
  const children = state.workflow.root.children;
  children.splice(index, 1);
  if (state.selected === index) state.selected = -1;
  else if (state.selected > index) state.selected -= 1;
  markDirty();
  render();
}

function clearDropMarkers() {
  for (const li of document.querySelectorAll("#canvas li[data-node]")) {
    li.classList.remove("drop-above", "drop-below");
  }
}

function handleDragEnd() {
  dragState = null;
  pendingDrop = null;
  clearDropMarkers();
}

function handleCanvasDragOver(e) {
  if (!dragState) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = dragState.type === "new" ? "copy" : "move";
  const li = e.target.closest("#canvas li[data-node]");
  const children = state.workflow.root.children;
  if (!li) {
    pendingDrop = children.length;
    clearDropMarkers();
    return;
  }
  const index = children.findIndex((c) => c.id === li.dataset.node);
  if (index < 0) return;
  const rect = li.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  pendingDrop = before ? index : index + 1;
  clearDropMarkers();
  li.classList.add(before ? "drop-above" : "drop-below");
}

function handleCanvasDrop(e) {
  if (!dragState || pendingDrop === null) return;
  e.preventDefault();
  if (dragState.type === "new") {
    insertAction(dragState.command, pendingDrop);
  } else {
    moveNodeTo(dragState.from, pendingDrop);
    markDirty();
    render();
  }
  pendingDrop = null;
  clearDropMarkers();
}

function render() {
  renderCanvas();
  renderProps();
}

function renderCanvas() {
  const list = $("canvas");
  list.textContent = "";
  const children = state.workflow.root.children;
  children.forEach((node, index) => {
    const li = document.createElement("li");
    li.dataset.node = node.id;
    if (index === state.selected) li.classList.add("selected");
    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(index + 1);
    const cmd = document.createElement("span");
    cmd.className = "cmd";
    cmd.textContent = node.command;
    const args = document.createElement("span");
    args.className = "args";
    const withValue = node["with"] || {};
    args.textContent = Object.keys(withValue).length ? JSON.stringify(withValue) : "";
    const ops = document.createElement("span");
    ops.className = "ops";
    const up = document.createElement("button");
    up.textContent = "↑";
    up.title = "上移";
    const down = document.createElement("button");
    down.textContent = "↓";
    down.title = "下移";
    const del = document.createElement("button");
    del.textContent = "✕";
    del.title = "删除";
    up.addEventListener("click", (e) => { e.stopPropagation(); moveNode(index, -1); });
    down.addEventListener("click", (e) => { e.stopPropagation(); moveNode(index, 1); });
    del.addEventListener("click", (e) => { e.stopPropagation(); removeNode(index); });
    ops.appendChild(up);
    ops.appendChild(down);
    ops.appendChild(del);
    li.appendChild(idx);
    li.appendChild(cmd);
    li.appendChild(args);
    li.appendChild(ops);
    li.draggable = true;
    li.addEventListener("dragstart", (e) => {
      dragState = { type: "move", from: index };
      e.dataTransfer.effectAllowed = "move";
      li.classList.add("dragging");
    });
    li.addEventListener("dragend", () => {
      li.classList.remove("dragging");
      handleDragEnd();
    });
    li.addEventListener("click", () => { state.selected = index; render(); });
    list.appendChild(li);
  });
  if (!children.length) {
    const empty = document.createElement("li");
    empty.className = "hint";
    empty.textContent = "画布为空：点击左侧命令追加节点";
    list.appendChild(empty);
  }
}

function renderProps() {
  const body = $("props-body");
  body.textContent = "";
  const node = state.workflow.root.children[state.selected];
  if (!node) {
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "未选中节点";
    body.appendChild(hint);
    return;
  }
  body.appendChild(textField("节点 ID", node.id, (v) => { node.id = v; markDirty(); renderCanvas(); }));
  const commandWrap = document.createElement("div");
  commandWrap.className = "field";
  const commandLabel = document.createElement("label");
  commandLabel.textContent = "命令";
  const commandInput = document.createElement("input");
  commandInput.type = "text";
  commandInput.value = node.command;
  commandInput.readOnly = true;
  commandWrap.appendChild(commandLabel);
  commandWrap.appendChild(commandInput);
  body.appendChild(commandWrap);
  body.appendChild(numberField("超时（秒，可选）", node.timeout_seconds, (v) => {
    if (v === null) delete node.timeout_seconds; else node.timeout_seconds = v;
    markDirty();
  }));
  body.appendChild(numberField("重试次数", node.retry_count ?? 0, (v) => {
    if (v === null || v === 0) delete node.retry_count; else node.retry_count = v;
    markDirty();
  }));
  const manifest = manifestOf(node.command);
  const schema = manifest ? manifest.input_schema : {};
  const properties = schema.properties || {};
  const keys = Object.keys(properties);
  if (!keys.length) {
    body.appendChild(jsonField("参数（with，JSON）", node["with"], (v) => {
      if (v === null) node["with"] = {}; else node["with"] = v;
      markDirty();
      renderCanvas();
    }));
  } else {
    const required = new Set(schema.required || []);
    for (const key of keys) {
      body.appendChild(schemaField(node, key, properties[key], required.has(key)));
    }
  }
}

function setWith(node, key, value) {
  if (!node["with"]) node["with"] = {};
  if (value === null || value === undefined || value === "") delete node["with"][key];
  else node["with"][key] = value;
  markDirty();
  renderCanvas();
}

function schemaField(node, key, propSchema, required) {
  const value = node["with"] ? node["with"][key] : undefined;
  if (propSchema.enum) {
    return selectField(key, propSchema, required, value, (v) => setWith(node, key, v));
  }
  const type = propSchema.type;
  if (type === "boolean") {
    return checkboxField(key, required, Boolean(value), (v) => setWith(node, key, v));
  }
  if (type === "integer" || type === "number") {
    return numberField(key, value, (v) => setWith(node, key, v), required);
  }
  if (type === "array" || type === "object") {
    return jsonField(key, value, (v) => setWith(node, key, v), required);
  }
  return textField(key, value === undefined ? "" : String(value), (v) => setWith(node, key, v), required);
}

function wrapField(labelText, required, input, hint) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  input.dataset.field = labelText;
  const label = document.createElement("label");
  label.textContent = labelText;
  if (required) {
    const star = document.createElement("span");
    star.className = "req";
    star.textContent = " *";
    label.appendChild(star);
  }
  if (hint) input.title = hint;
  wrap.appendChild(label);
  wrap.appendChild(input);
  return wrap;
}

function textField(labelText, value, onChange, required) {
  const input = document.createElement("input");
  input.type = "text";
  input.value = value;
  input.placeholder = "${...}";
  input.addEventListener("input", () => {
    input.style.borderColor = "";
    onChange(input.value.trim());
  });
  return wrapField(labelText, required, input, REFERENCE_HINT);
}

function numberField(labelText, value, onChange, required) {
  const input = document.createElement("input");
  input.type = "number";
  input.step = "any";
  input.value = value === undefined || value === null ? "" : String(value);
  input.addEventListener("change", () => {
    input.style.borderColor = "";
    if (input.value === "") { onChange(null); return; }
    const parsed = Number(input.value);
    if (Number.isNaN(parsed)) { input.style.borderColor = "var(--bad)"; return; }
    onChange(parsed);
  });
  return wrapField(labelText, required, input);
}

function checkboxField(labelText, required, value, onChange) {
  const input = document.createElement("input");
  input.type = "checkbox";
  input.checked = value;
  input.addEventListener("change", () => onChange(input.checked));
  return wrapField(labelText, required, input);
}

function selectField(labelText, propSchema, required, value, onChange) {
  const input = document.createElement("select");
  const empty = document.createElement("option");
  empty.value = "";
  empty.textContent = "（未设置）";
  input.appendChild(empty);
  for (const option of propSchema.enum) {
    const element = document.createElement("option");
    element.value = String(option);
    element.textContent = String(option);
    input.appendChild(element);
  }
  input.value = value === undefined ? "" : String(value);
  input.addEventListener("change", () => onChange(input.value === "" ? null : input.value));
  return wrapField(labelText, required, input);
}

function jsonField(labelText, value, onChange, required) {
  const input = document.createElement("textarea");
  input.value = value === undefined || value === null ? "" : JSON.stringify(value, null, 2);
  input.placeholder = "{}";
  input.addEventListener("change", () => {
    input.style.borderColor = "";
    if (input.value.trim() === "") { onChange(null); return; }
    try {
      onChange(JSON.parse(input.value));
    } catch {
      input.style.borderColor = "var(--bad)";
    }
  });
  return wrapField(labelText, required, input, "JSON 对象；值支持 ${...} 引用");
}

function showCompileMessage(text, ok) {
  const panel = $("compile-panel");
  panel.textContent = "";
  const line = document.createElement("span");
  line.className = ok ? "ok" : "bad";
  line.textContent = text;
  panel.appendChild(line);
}

function renderCompileResult(data) {
  const panel = $("compile-panel");
  panel.textContent = "";
  const badge = $("valid-badge");
  badge.classList.remove("hidden");
  if (data.valid) {
    badge.textContent = "✓ valid";
    badge.className = "ok";
    const line = document.createElement("span");
    line.className = "ok";
    line.textContent = `编译通过 · catalog ${String(data.catalog_digest).slice(0, 12)}`;
    panel.appendChild(line);
  } else {
    badge.textContent = "✗ invalid";
    badge.className = "bad";
    for (const error of data.errors) {
      const line = document.createElement("div");
      line.className = "error-line bad";
      line.textContent = (error.path ? `${error.path}: ` : "") + error.message;
      panel.appendChild(line);
    }
  }
}

async function openWorkflow(name) {
  try {
    const doc = await api("GET", `/api/workflows/${encodeURIComponent(name)}`);
    if (!doc.root || doc.root.type !== "sequence") {
      showCompileMessage("画布仅支持 sequence 根的工作流（树形编辑见 M11）", false);
      return;
    }
    state.workflow = doc;
    state.selected = -1;
    $("file-name").value = name;
    clearDirty();
    render();
    showCompileMessage(`已打开 ${name}`, true);
  } catch (err) {
    showCompileMessage(String(err.message || err), false);
  }
}

async function saveWorkflow() {
  const name = $("file-name").value.trim();
  if (!NAME_PATTERN.test(name)) {
    showCompileMessage(`非法文件名：${name || "（为空）"}（限字母开头，字母/数字/_/-）`, false);
    return;
  }
  try {
    await api("PUT", `/api/workflows/${encodeURIComponent(name)}`, state.workflow);
  } catch (err) {
    showCompileMessage(String(err.message || err), false);
    return;
  }
  clearDirty();
  await refreshOpenList(name);
  showCompileMessage(`已保存 workflows/${name}.json`, true);
}

async function compileWorkflow() {
  try {
    renderCompileResult(await api("POST", "/api/compile", { workflow: state.workflow }));
  } catch (err) {
    showCompileMessage(String(err.message || err), false);
  }
}

async function init() {
  const data = await api("GET", "/api/catalog");
  state.catalog = data.commands;
  renderPalette();
  await refreshOpenList();
  newWorkflow();
  $("palette-filter").addEventListener("input", renderPalette);
  const canvas = $("canvas");
  canvas.addEventListener("dragover", handleCanvasDragOver);
  canvas.addEventListener("drop", handleCanvasDrop);
  canvas.addEventListener("dragleave", (e) => {
    if (e.target === canvas) clearDropMarkers();
  });
  $("btn-new").addEventListener("click", () => { newWorkflow(); showCompileMessage("已新建草稿", true); });
  $("open-select").addEventListener("change", (e) => { if (e.target.value) openWorkflow(e.target.value); });
  $("btn-save").addEventListener("click", saveWorkflow);
  $("btn-compile").addEventListener("click", compileWorkflow);
  window.addEventListener("beforeunload", (e) => {
    if (state.dirty) { e.preventDefault(); e.returnValue = ""; }
  });
}

init();
</script>
</body>
</html>

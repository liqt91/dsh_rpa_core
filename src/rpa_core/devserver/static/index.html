<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rpa_core 编辑器</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
  <span class="brand">rpa_core 编辑器</span>
  <input id="file-name" placeholder="文件名（如 demo）" style="width: 160px">
  <span id="dirty-badge" class="hidden" style="color: var(--bad); font-size: 12px;">● 未保存</span>
  <button id="btn-new">新建</button>
  <select id="open-select"><option value="">打开…</option></select>
  <button id="btn-save">保存</button>
  <button id="btn-compile">编译</button>
  <button id="btn-run" title="运行当前流程（子进程）">▶ 运行</button>
  <button id="btn-run-status" title="按最近一次运行高亮画布节点">运行状态</button>
  <button id="btn-run-cancel" class="hidden" title="取消运行">■ 取消</button>
  <span class="toolbar-sep"></span>
  <button id="btn-undo" title="撤销（Ctrl+Z）" disabled>↶ 撤销</button>
  <button id="btn-redo" title="重做（Ctrl+Y）" disabled>↷ 重做</button>
  <span id="valid-badge" class="hidden"></span>
</header>
<main>
  <aside id="palette">
    <input id="palette-filter" placeholder="过滤命令…">
    <ul id="palette-list"></ul>
  </aside>
  <section id="canvas-wrap">
    <h2>画布 · sequence root <button id="btn-fullscreen" title="全屏专注画布" style="padding:0 8px;font-size:12px;">⛶ 全屏</button></h2>
    <ol id="canvas"></ol>
    <p class="hint">点击左侧命令/控制流追加节点，或拖拽到画布任意位置插入；拖拽节点 grip（⠿）移动子树。引用语法 ${inputs.x}、${steps.节点.outputs.键}、${loop.item}</p>
    <div id="multi-bar" class="hidden">
      <span id="multi-count"></span>
      <button id="btn-up" title="上移选中节点">上移</button>
      <button id="btn-down" title="下移选中节点">下移</button>
      <button id="btn-copy" title="复制选中子树（Ctrl+C）">复制</button>
      <button id="btn-delete" title="删除选中节点（Delete）">删除</button>
    </div>
  </section>
  <aside id="props">
    <h2>属性</h2>
    <div id="props-body"></div>
    <div class="props-sep"></div>
    <div id="elements-head">
      <h2>元素库</h2>
      <div class="capture-entry">
        <button id="btn-element-capture" title="捕获新元素">＋捕获</button>
        <button id="btn-elements-refresh" title="刷新元素库">↻</button>
        <div id="capture-menu" class="hidden">
          <button data-kind="browser">网页（无缝扩展）</button>
          <button data-kind="desktop">桌面（hover）</button>
        </div>
      </div>
    </div>
    <ul id="elements-list"></ul>
  </aside>
</main>
<div id="element-dialog-mask" class="hidden">
  <div id="element-dialog">
    <h3 id="element-dialog-title">元素确认</h3>
    <div class="dlg-field"><label>元素名（元素库标识）</label><input type="text" id="element-dialog-name"></div>
    <div class="dlg-field"><label>Selector（可编辑）</label><input type="text" id="element-dialog-selector"></div>
    <div class="dlg-meta" id="element-dialog-meta"></div>
    <div class="dlg-verify" id="element-dialog-verify"></div>
    <div class="dlg-actions">
      <button id="element-dialog-cancel">放弃</button>
      <button id="element-dialog-save">保存入库</button>
    </div>
  </div>
</div>
<footer>
  <div id="compile-panel"><span class="hint">点击「编译」校验当前工作流（保存草稿不要求编译通过）</span></div>
  <div id="run-panel" class="hidden">
    <div id="run-head">
      <span id="run-status-text"></span>
      <span id="run-events-toggle">事件流 ▾</span>
    </div>
    <div id="run-events" class="hidden"></div>
  </div>
  <details id="glossary">
    <summary>术语表</summary>
    <dl id="glossary-list"></dl>
  </details>
</footer>
<script src="/static/i18n.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/app.js"></script>
</body>
</html>

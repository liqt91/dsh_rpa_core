# 打 `editor-v<version>` tag 即在 Windows runner 上构建窗口并创建 Release。
#
# 为什么需要 CI：窗口是 PPX + PyInstaller 的 Windows 产物（约 16MB），不进 npm 包，
# 也进不了 git（dist/ 已忽略）。维护者本地 build 一次后手工传 Release 容易漏
# .sha256 或压错包，而且下次改了前端没人记得重打。tag 是唯一的版本事实源。
#
# 发版：
#   git tag editor-v0.1.0 && git push origin editor-v0.1.0
# （tag 必须与 .harness/demo/ppx_probe/app/ppx.toml 的 version 一致，
#   verify_editor_artifact.py 会拦住不一致的 tag。）
name: Editor Release

on:
  push:
    tags:
      - "editor-v*"
    # 改了构建链就先自测一次，不必为了看日志去动已经推上去的 tag。
    # tag push 不受 paths 过滤影响；发版仍只有 tag 会做（见下面两个 if）。
    branches:
      - "ppx-only"
    paths:
      - ".github/workflows/editor-release.yml"
      - ".harness/scripts/build_editor.py"
      - ".harness/scripts/verify_editor_artifact.py"
      - ".harness/demo/ppx_probe/app/**"
      - "commands/**"
      - "src/rpa_core/gui/i18n.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      # runner 是 en-US，Python 的 stdout 默认 cp1252；build_editor.py 的中文日志
      # 会在第一句 print 就抛 UnicodeEncodeError。脚本另有 errors=replace 兜底，
      # 这一层保证日志里的中文仍然可读。
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PPX 的前端构建要 pnpm 11 + Node 22；gui/ 没有锁文件，别用 frozen-lockfile。
      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Install PPX toolchain
        shell: pwsh
        run: |
          python -m pip install uv
          uv tool install --python 3.12 ppx-py==6.0.1
          # 把 tool venv 的 python 显式交给构建脚本，别让它去猜 uv tool dir
          # 下面的目录名（首次 CI 只跑了 1 秒就退出，八成是猜失败）。
          $toolDir = (uv tool dir | Out-String).Trim()
          $dirs = @(Get-ChildItem -LiteralPath $toolDir -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'ppx-py*' })
          if ($dirs.Count -eq 0) {
            $dirs = @(Get-ChildItem -LiteralPath $toolDir -Directory -ErrorAction SilentlyContinue)
          }
          $toolPython = $dirs |
            ForEach-Object { Join-Path $_.FullName 'Scripts/python.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $toolPython) { throw "uv tool dir 里没有 tool python：$toolDir" }
          "RPA_PPX_PYTHON=$toolPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "RPA_PPX_PYTHON=$toolPython"

      # 前端单独构建：build_editor.py 加 --skip-frontend 后就不需要 pnpm 在 PATH 上，
      # CI 的职责边界更清楚（这一步产 gui/dist，下一步只做 PyInstaller + 打 zip）。
      - name: Build frontend
        working-directory: .harness/demo/ppx_probe/app/gui
        shell: pwsh
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Build portable editor
        shell: pwsh
        run: |
          # pwsh 默认会让 native 命令非零退出直接抛终止错误，那样下面的
          # $LASTEXITCODE 判断和 ::error:: 注释根本执行不到。
          $PSNativeCommandUseErrorActionPreference = $false
          python .harness/scripts/build_editor.py --release --skip-frontend *> editor-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # 匿名读不到 Actions 日志，但 annotations 是公开的：把构建日志尾部
            # 编成一条 ::error:: 注释，排错时不用进仓库管理员权限。
            $tail = (Get-Content editor-build.log -Tail 80) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::build_editor.py exited $code :: $tail"
            exit $code
          }
          Get-Content editor-build.log

      - name: Diagnose build environment
        if: failure()
        shell: pwsh
        run: |
          $toolDir = (uv tool dir | Out-String).Trim()
          Write-Output "::error::uv tool dir = $toolDir"
          python -c "import shutil; print('uv =', shutil.which('uv'))"
          Get-ChildItem -LiteralPath $toolDir -ErrorAction SilentlyContinue |
            Select-Object -First 20 -ExpandProperty Name
          Write-Output "::error::RPA_PPX_PYTHON = $env:RPA_PPX_PYTHON"
          if (Test-Path editor-build.log) { Get-Content editor-build.log -Tail 40 }

      # 上传前把「tag / 包内版本 / exe / sha256」四件事对齐，别让坏包进 Release。
      - name: Verify artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: python .harness/scripts/verify_editor_artifact.py --tag ${{ github.ref_name }}

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Editor ${{ github.ref_name }}
          body: |
            编辑窗口（Windows x64 便携包），由本仓 `.harness/scripts/build_editor.py --release` 构建。

            安装：`rpa-skill editor install`，或装技能时加 `--with-editor`。
            安装器会自动读取同 Release 的 `RPA-Editor-win64.zip.sha256` 做校验；
            离线可用 `--editor-zip` 指定本地包。

            运行时框架 PPX (https://github.com/pangao1990/PPX) 采用 AGPL-3.0。
            对应源码见该仓库，本仓的构建说明见 README「编辑窗口」一节与 build_editor.py。
          files: |
            dist/RPA-Editor-win64.zip
            dist/RPA-Editor-win64.zip.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

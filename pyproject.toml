[project]
name = "rpa-core-runtime"
version = "0.1.0"
description = "Clean-room typed RPA runtime core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5",
  "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
]

# 原生桌面 GUI（ADR 0014 方案 E）为可选能力：默认 `uv sync --all-groups` 不安装
# Qt 重依赖，需要时用 `uv sync --extra gui` 启用；rpa-core gui 在缺依赖时友好报错。
[project.optional-dependencies]
gui = [
  "PySide6-Essentials>=6.7,<7",
  "QDarkStyle>=3.2,<4",
]

[project.scripts]
rpa-core = "rpa_core.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_core"]

[tool.hatch.build.targets.wheel.force-include]
# 命令目录是运行时必需资源：打包进 wheel（pip install 后开箱可用），开发态仍读仓库根
"commands" = "rpa_core/commands"
# 扩展源码是 install-extension 打包 CRX 的输入，同样必须进 wheel
"extension" = "rpa_core/extension"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# scripts/ 是一次性调研抓取脚本（非产品代码），不入 lint 门禁
# .harness/demo/ 是 ADR 0014 的 GUI 技术选型实证脚手架，同样不入门禁
exclude = ["scripts/", ".harness/demo/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[project]
name = "rpa-core-runtime"
version = "0.1.0"
description = "Clean-room typed RPA runtime core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5",
  "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
  # desktop.screenshot 的回落路径用 capture_as_image()——pywinauto 内部就是 PIL
  # （未装时 Image=None，save 处炸 'NoneType' has no attribute 'save'，M38 任务单 §1.5）
  "pillow>=10.0,<12; sys_platform == 'win32'",
]

# 原生桌面 GUI（ADR 0014 方案 E）为可选能力，GUI 是主力形态：
# `uv sync --all-groups` 只覆盖 dependency-groups（dev），**不含** extras；
# 正确命令是 `uv sync --all-groups --extra gui`（不带 --extra gui 会把已装的
# Qt 依赖清掉，rpa-core gui 随后报 GUI_EXTRA_MISSING）。
[project.optional-dependencies]
gui = [
  "PySide6-Essentials>=6.7,<7",
  "QDarkStyle>=3.2,<4",
]

[project.scripts]
rpa-core = "rpa_core.cli:main"
# 扩展 bridge host 入口：native messaging host manifest 的 path 指向该控制台脚本
# （Windows 下 .exe 无参数，避免依赖 manifest path 的参数解析；ADR 0015 / M20）
rpa-core-ext-host = "rpa_core.workers.ext_bridge:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_core"]

[tool.hatch.build.targets.wheel.force-include]
# 命令目录是运行时必需资源：打包进 wheel（pip install 后开箱可用），开发态仍读仓库根
"commands" = "rpa_core/commands"
# 扩展源码是 install-extension 打包 CRX 的输入，同样必须进 wheel
"extension" = "rpa_core/extension"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# scripts/ 是一次性调研抓取脚本（非产品代码），不入 lint 门禁
# .harness/demo/ 是 ADR 0014 的 GUI 技术选型实证脚手架，同样不入门禁
# .harness/spike/ 是 ADR 0015 的 native messaging 真机实证脚手架，同样不入门禁
exclude = ["scripts/", ".harness/demo/", ".harness/spike/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

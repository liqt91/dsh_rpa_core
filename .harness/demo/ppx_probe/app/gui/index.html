<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RPA Probe · PPX</title>
</head>
<body>
  <div id="app">
    <header id="bar">
      <span class="brand">RPA Probe</span>
      <span id="status" class="status">正在连接 Python…</span>
      <span class="spacer"></span>
      <select id="flowPicker" aria-label="选择流程"></select>
      <button id="compileBtn" type="button">编译校验</button>
    </header>
    <main>
      <aside id="left">
        <div class="paneHead">
          <input id="search" type="search" placeholder="搜索指令" autocomplete="off" />
          <div id="cmdCount" class="count"></div>
        </div>
        <div id="cmds" class="cmdList"></div>
      </aside>
      <section id="mid">
        <div id="flowTitle" class="flowTitle">未打开流程</div>
        <div id="cards" class="cardList"></div>
      </section>
      <aside id="right">
        <div class="paneHead"><span class="paneTitle">节点详情</span><span id="rpcMs" class="count"></span></div>
        <pre id="detail" class="detail">点击中间卡片查看节点 AST</pre>
        <div id="compileOut" class="compileOut"></div>
      </aside>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

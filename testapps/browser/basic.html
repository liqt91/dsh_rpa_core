<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>RPA L2 靶页 basic</title>
<style>
  /* 遮挡靶子：#covered 被 #overlay 完全盖住，供 click 的 ELEMENT_COVERED 负路径用 */
  #stage { position: relative; width: 300px; height: 120px; }
  #covered { position: absolute; left: 10px; top: 10px; width: 100px; height: 40px; }
  #overlay {
    position: absolute; left: 0; top: 0; width: 300px; height: 120px;
    background: rgba(128, 128, 128, 0.6); z-index: 10;
  }
  /* 滚动靶子：页面整体可滚（spacer 撑高）+ 元素内滚动 #box */
  #box { height: 100px; overflow: auto; border: 1px solid #999; }
  #boxinner { height: 800px; }
  #spacer { height: 3000px; }
  /* 拖拽靶子 */
  #src { width: 80px; height: 30px; background: #cde; }
  #drop { width: 160px; height: 60px; background: #eee; border: 1px dashed #666; }
</style>
</head>
<body>
<!-- getText 靶子：textContent 恰为 "text"（text/html/outerHTML 三态后续变体用） -->
<div id="t">text</div>

<!-- getText href 靶子：href 读回的是属性原值（S4.2 探针实测），断言用精确值 -->
<a id="link" href="/next">next</a>

<!-- queryAll 多匹配靶子 -->
<span class="q">q1</span>
<span class="q">q2</span>

<!-- input 靶子：三模式（fill/type/clipboard）与 append/pressEnter 的读侧；预置值供 getText value 用 -->
<input id="kw" type="text" value="preset">

<!-- select 靶子：三个 option，供 select 的 index/label/value 三态用 -->
<select id="sel">
  <option value="alpha">Alpha</option>
  <option value="beta">Beta</option>
  <option value="gamma">Gamma</option>
</select>

<!-- check 靶子 -->
<input id="chk" type="checkbox">

<!-- waitFor 的 hidden 态靶子（attached 但不可见） -->
<div id="hidden" style="display:none">hidden</div>

<!--
  交互读侧约定：动作类命令的读侧是 #status / #mods 两个 span——
  动作回写 #status，修饰键回写 #mods（CWAS = Ctrl/Win/Shift/Alt）。
  L2 的 verify 步用 getText/executeScript 独立读回，不拿执行器自报当证据。
-->
<button id="btn">Button</button>
<span id="status">idle</span>
<span id="mods"></span>

<!-- hover 靶子 -->
<div id="hv">hover me</div>

<!-- 元素内滚动靶子 -->
<div id="box"><div id="boxinner">inner</div></div>

<!-- 拖拽靶子 -->
<div id="src" draggable="true">drag me</div>
<div id="drop">drop here</div>

<!-- 遮挡靶子 -->
<div id="stage">
  <button id="covered">Covered</button>
  <div id="overlay"></div>
</div>

<!-- 窗口滚动余量 -->
<div id="spacer"></div>

<script>
(function () {
  var clicks = 0;
  var status = document.getElementById("status");
  var mods = document.getElementById("mods");
  function setStatus(text) { status.textContent = text; }
  function setMods(e) {
    mods.textContent = (e.ctrlKey ? "C" : "") + (e.metaKey ? "W" : "")
      + (e.shiftKey ? "S" : "") + (e.altKey ? "A" : "");
  }
  var btn = document.getElementById("btn");
  // click 只认左键：真实浏览器右键不发 click（发 contextmenu/auxclick），
  // 让 #status 能被右键/中键的专属事件占据而不被覆盖
  btn.addEventListener("click", function (e) {
    if (e.button !== 0) return;
    clicks += 1;
    setStatus("clicked:" + clicks);
    setMods(e);
  });
  btn.addEventListener("dblclick", function (e) {
    setStatus("dblclicked");
    setMods(e);
  });
  btn.addEventListener("mousedown", function (e) {
    if (e.button === 1) { setStatus("middle-down"); setMods(e); }
  });
  btn.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    setStatus("ctx");
    setMods(e);
  });
  btn.addEventListener("auxclick", function (e) {
    if (e.button === 1) { setStatus("aux"); setMods(e); }
  });
  document.getElementById("hv").addEventListener("mouseover", function () {
    setStatus("hovered");
  });
  var drop = document.getElementById("drop");
  drop.addEventListener("dragover", function (e) { e.preventDefault(); });
  drop.addEventListener("drop", function (e) {
    e.preventDefault();
    setStatus("dropped");
  });
})();
</script>
</body>
</html>

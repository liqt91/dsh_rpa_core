<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><style>
  body { font-family: sans-serif; width: 300px; padding: 12px; }
  h3 { margin: 0 0 8px; font-size: 14px; }
  .row { display: flex; gap: 6px; margin: 8px 0; }
  input { flex: 1; font-family: monospace; font-size: 12px; padding: 4px; }
  button { padding: 4px 10px; font-size: 12px; }
  #status { font-size: 12px; margin-top: 8px; }
  .ok { color: #1a7f37; } .bad { color: #cf222e; }
</style></head>
<body>
  <h3>rpa_core 捕获扩展</h3>
  <div id="hint" style="font-size:12px;color:#57606a;margin-bottom:6px;">
    已自动配对（devserver 首次接触自动采纳）。无需手动操作。
  </div>
  <div class="row">
    <input id="token" type="text" readonly>
    <button id="gen">重新生成</button>
  </div>
  <div id="status"></div>
  <h3 style="margin-top:12px;">执行权限</h3>
  <div style="font-size:12px;color:#57606a;">默认：整个浏览器（全部窗口/标签页/Cookie）</div>
  <div class="row">
    <select id="perm" style="flex:1;font-size:12px;padding:4px;">
      <option value="browser">整个浏览器（默认）</option>
      <option value="tabs">仅指定标签页（预留）</option>
      <option value="origins">仅指定站点（预留）</option>
    </select>
  </div>
  <div id="perm-status" style="font-size:12px;color:#57606a;"></div>
  <script src="popup.js"></script>
</body>
</html>
